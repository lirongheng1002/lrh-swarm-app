name: build-apk

# 云端打包 Android APK：把本项目推到 GitHub（默认 main 分支），
# 或手动点 Actions -> build-apk -> Run workflow。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Python 3.11（buildozer/p4a 最稳组合）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 buildozer 工具链（SDK/NDK，二次构建免重下）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-py311

      - name: 安装 Java + 稳定版 Buildozer 1.5.0
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --user buildozer==1.5.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 打包 APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: LRH集群控制-apk
          path: bin/*.apk