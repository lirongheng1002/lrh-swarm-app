name: build-apk

# 云端打包 Android APK：推到 main 自动构建，
# 或手动 Actions -> build-apk -> Run workflow。
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Python 3.11（buildozer/p4a 最稳组合）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 buildozer 工具链（SDK/NDK，二次构建免重下）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-py311-2

      - name: 安装 Java + 稳定版 Buildozer 1.5.0
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --user buildozer==1.5.0 cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 --version
          buildozer --version

      - name: 打包 APK（无缓冲输出保真）
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONUNBUFFERED=1
          pv=$(python3 --version 2>&1 | head -n1)
          jv=$(java -version 2>&1 | head -n1)
          echo "::error::ENV pwd=$(pwd) buildozer=$(command -v buildozer) python=$pv java=$jv"
          stdbuf -oL -eL buildozer android debug 2>&1 | tee buildozer_pty.log > /dev/null
          code=$?
          echo "::error::BUILDOZER_EXIT=$code (0=成功)"
          echo "::error::--- buildozer_pty.log 尾部 60 行 ---"
          tail -n 60 buildozer_pty.log 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done
          echo "::error::--- .buildozer 检查 ---"
          ls -la .buildozer 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done
          exit $code
        shell: bash

      - name: 打包现场回传仓库（无论成败，成功时含 APK）
        if: always()
        run: |
          tar czf ci_snapshot.tar.gz buildozer_pty.log .buildozer/buildozer.log 2>/dev/null || tar czf ci_snapshot.tar.gz buildozer_pty.log 2>/dev/null
          echo "::error::SNAPSHOT $(ls -la ci_snapshot.tar.gz 2>/dev/null | head -n1)"
          git config user.name "ci-bot"
          git config user.email "ci@github.local"
          git add ci_snapshot.tar.gz
          git commit -m "ci: 打包现场回传 [skip ci]" || echo "::error::无现场可回传"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main 2>&1 | tail -n2 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::error::回传步骤结束"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: LRH集群控制-apk
          path: bin/*.apk