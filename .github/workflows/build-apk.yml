name: build-apk

# 云端打包 Android APK：把本项目推到 GitHub（默认 main 分支），
# 或手动点 Actions -> build-apk -> Run workflow。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Python 3.11（buildozer/p4a 最稳组合）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 buildozer 工具链（SDK/NDK，二次构建免重下）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-py311

      - name: 安装 Java + 稳定版 Buildozer 1.5.0
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --user buildozer==1.5.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 --version
          buildozer --version

      - name: 打包 APK（输出直接落盘文件，无缓冲）
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug > buildozer.log 2>&1
          code=$?
          echo "BUILDOZER_EXIT=$code (0=成功)"
          echo "--- buildozer.log 最后10行 ---"
          tail -n 10 buildozer.log
          exit $code
        shell: bash

      - name: 失败时把构建日志回传到仓库（自助排查，[skip ci] 防循环）
        if: failure()
        run: |
          mkdir -p ci_logs
          cp -f .buildozer/buildozer.log ci_logs/buildozer.log 2>/dev/null || true
          cp -f buildozer.log ci_logs/stdout.log 2>/dev/null || true
          find .buildozer -name '*.log' -not -name 'buildozer.log' -exec sh -c 'cp -f "$1" ci_logs/ 2>/dev/null' _ {} \; 2>/dev/null || true
          ls -la ci_logs
          git config user.name "ci-bot"
          git config user.email "ci@github.local"
          git add ci_logs
          git commit -m "ci: 回传构建日志 [skip ci]" || echo "无日志可回传"
          git push origin main 2>&1 | tail -n 3 || echo "日志回传推送失败"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        shell: bash

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: LRH集群控制-apk
          path: bin/*.apk