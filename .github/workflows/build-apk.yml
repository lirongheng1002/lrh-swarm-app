name: build-apk

# 云端打包 Android APK：把本项目推到 GitHub（默认 main 分支），
# 或手动点 Actions -> build-apk -> Run workflow。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Python 3.11（buildozer/p4a 最稳组合）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 buildozer 工具链（SDK/NDK，二次构建免重下）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-py311

      - name: 安装 Java + 稳定版 Buildozer 1.5.0
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --user buildozer==1.5.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 --version
          buildozer --version

      - name: 打包 APK（输出同时落盘 buildozer.log）
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug 2>&1 | tee buildozer.log
        shell: bash

      - name: 失败时自动提取日志尾部为错误标注（方便 API 自查）
        if: failure()
        run: |
          echo '::error::====== buildozer 日志尾部（最后60行） ======'
          tail -n 60 buildozer.log 2>/dev/null || true
          for f in .buildozer/android/platform/build-*/*.log; do
            if [ -f "$f" ]; then
              echo '::error::====== p4a 日志尾部（最后30行） ======'
              tail -n 30 "$f"
            fi
          done
        continue-on-error: true
        shell: bash

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: LRH集群控制-apk
          path: bin/*.apk